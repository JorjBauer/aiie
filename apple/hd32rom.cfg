# Linker config for the HD32 slot ROM (apple/hd32rom.s): exactly 256 bytes,
# assembled at $C700 (slot 7). The code never refers to its own address, so the
# same image serves any slot; only the slot byte and the floppy fallback are
# filled in by HD32::loadROM.
MEMORY {
    ROM: start = $C700, size = $0100, fill = yes, fillval = $00, file = %O;
}
SEGMENTS {
    CODE: load = ROM, type = ro;
}
