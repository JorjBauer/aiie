# Linker config for the mouse card's slot ROM (apple/mouserom.s): exactly 256
# bytes, assembled at $C400. The code never refers to its own address, so the
# same image serves any slot; Mouse::loadROM fills in the two slot bytes.
MEMORY {
    ROM: start = $C400, size = $0100, fill = yes, fillval = $00, file = %O;
}
SEGMENTS {
    CODE: load = ROM, type = ro;
}
