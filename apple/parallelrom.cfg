# Linker config for the parallel printer card's slot ROM (apple/parallelrom.s):
# exactly 256 bytes, assembled at $C100 (slot 1). The code never refers to its
# own address, so the same image serves any slot; ParallelCard::loadROM fills
# in the two slot bytes.
MEMORY {
    ROM: start = $C100, size = $0100, fill = yes, fillval = $00, file = %O;
}
SEGMENTS {
    CODE: load = ROM, type = ro;
}
