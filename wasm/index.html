<!doctype html>
<html><head><meta charset="utf-8"><title>aiie //e (wasm)</title>
<style>body{background:#111;color:#ccc;font:14px system-ui;text-align:center}
canvas{border:2px solid #444;image-rendering:pixelated;background:#000;margin-top:1em;outline:none;max-width:98vw}
#status{margin:.4em}</style></head>
<body>
<h3>aiie Apple //e -- WebAssembly</h3>
<div id="status">loading...</div>
<canvas id="canvas" width="800" height="480" tabindex="1" oncontextmenu="event.preventDefault()"></canvas>
<div style="font-size:12px;color:#888">click the screen, then type / use arrow keys</div>
<script>
function mapKey(e){
  var k = e.key;
  if (k === 'Enter') return 13;
  if (k === 'Backspace') return 127;
  if (k === 'Escape') return 27;
  if (k === 'Tab') return 9;
  if (k === 'ArrowLeft') return 8;
  if (k === 'ArrowRight') return 21;
  if (k === 'ArrowUp') return 11;
  if (k === 'ArrowDown') return 10;
  if (k.length === 1){
    var c = k.charCodeAt(0);
    if (e.ctrlKey && c >= 64 && c < 128) return c & 0x1f;   // Ctrl-A..Z
    if (c >= 97 && c <= 122) return c - 32;                  // //e is uppercase
    return c;
  }
  return -1;
}
var Module = {
  canvas: (function(){ var c = document.getElementById('canvas');
    c.addEventListener('keydown', function(e){
      var b = mapKey(e);
      if (b >= 0){ Module.ccall('aiie_inject', null, ['number'], [b]); e.preventDefault(); }
    });
    return c; })(),
  arguments: ['/snake.woz'],
  print: function(t){ console.log(t); },
  printErr: function(t){ console.warn(t); },
  setStatus: function(t){ var s=document.getElementById('status'); if(s) s.textContent = t||'running'; }
};
</script>
<script src="aiie.js"></script>
</body></html>
